name: Deploy GH Pages

on:
  push:
    branches:
      - main
    paths:
      - 'src/uon_site/index.html'
      - 'src/uon_site/styles.css'
      - 'src/uon_site/build.js'
      - 'src/uon_site/noun-rune-3458897.png'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling one
# that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Static Site
        run: cd src/uon_site && node build.js

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # Only the built site (index.html and favicon.png) is published.
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: src/uon_site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
