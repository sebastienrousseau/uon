name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The job only reads the code; it pushes nothing and calls no write API.
permissions:
  contents: read

jobs:
  quality-and-security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry

      - name: Install project and dev tools
        run: poetry install --no-interaction --extras dev

      # `poetry install` resolves and installs the dependency set, but it
      # does not compile the maturin extension module into the venv.
      # `uon/__init__.py` does `from . import core`, so without this the
      # test job dies at conftest import with "cannot import name 'core'
      # from partially initialized module 'uon'".
      - name: Build the Rust extension into the venv
        run: |
          poetry run pip install "maturin>=1.10,<2.0"
          poetry run maturin develop

      - name: Lint (Ruff)
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Type check (MyPy)
        run: poetry run mypy src/

      - name: Import contracts (import-linter)
        run: poetry run lint-imports

      - name: Test (Pytest)
        run: poetry run pytest --cov=uon --cov-branch --cov-report=xml --cov-fail-under=100

  quality-and-security-all:
    # Branch protection requires this check by name. It stands for every
    # leg of the quality-and-security matrix, so adding or dropping a version never
    # renames a required check.
    name: quality-and-security (all)
    if: always()
    needs: quality-and-security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every leg of the matrix passed
        env:
          RESULT: ${{ needs.quality-and-security.result }}
        run: test "$RESULT" = success
