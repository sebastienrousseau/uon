[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "uon"
version = "0.0.1"
description = "Ultra-secure, biometric-signed remote terminal execution for macOS, Linux, and WSL."
authors = [{name = "Sebastien Rousseau", email = "sebastian.rousseau@gmail.com"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "fido2>=1.1,<3",
    "cryptography>=46.0.5,<49",
    "qrcode[pil]>=7.4",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
uon = "uon.cli:main"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "uon.core"
python-source = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=uon --cov-branch --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["src/uon"]

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    "if TYPE_CHECKING:",
    'if __name__ == "__main__"',
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "I", "N", "UP", "B", "SIM", "S", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
