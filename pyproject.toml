[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uon"
version = "0.1.0"
description = "Ultra-secure, local-network, FIDO2-signed remote terminal execution."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "uon contributors"}]

dependencies = [
    "click>=8.1,<9",
    "fido2>=1.1,<3",
    "paramiko>=3.4,<4",
    "cryptography>=46.0.5,<47",
    "qrcode[pil]>=7.4,<8",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[project.scripts]
uon = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-branch --cov-report=term-missing"

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    "if TYPE_CHECKING:",
    'if __name__ == "__main__"',
]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
