[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "uon"
version = "0.0.1"
description = "Ultra-secure, biometric-signed remote terminal execution for macOS, Linux, and WSL."
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]
readme = "README.md"
license = "MIT"
packages = [{include = "uon", from = "src"}]

[tool.poetry.scripts]
uon = "uon.cli:main"

[tool.poetry.dependencies]
python = "^3.12"
click = "^8.1"
fido2 = ">=1.1,<3"
paramiko = "^3.4"
cryptography = ">=46.0.5,<49"
qrcode = {extras = ["pil"], version = "^7.4"}
fastapi = ">=0.111,<1"
uvicorn = {extras = ["standard"], version = ">=0.30,<1"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
ruff = ">=0.4"
mypy = "^1.10"
httpx = ">=0.27"
pre-commit = ">=3.5"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=uon --cov-branch --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["src/uon"]

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    "if TYPE_CHECKING:",
    'if __name__ == "__main__"',
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "I", "N", "UP", "B", "SIM", "S", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
