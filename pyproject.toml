[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "uon"
version = "0.0.5"
description = "Ultra-secure, biometric-signed remote terminal execution for macOS, Linux, and WSL."
authors = [{name = "Sebastien Rousseau", email = "sebastian.rousseau@gmail.com"}]
license = {text = "AGPL-3.0-or-later"}
readme = "README.md"
requires-python = ">=3.12,<4"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
dependencies = [
    "click>=8.1",
    "fido2>=1.1,<3",
    "cryptography>=48.0.1,<49",
    "qrcode[pil]>=7.4",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "textual>=0.52,<1",
    "pydantic>=2.4,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "import-linter>=2.0",
    "ruff>=0.3",
    "mypy>=1.9",
    "httpx>=0.27,<1",
]

[project.scripts]
uon = "uon.cli:main"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "uon.core"
python-source = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=uon --cov-branch --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["src/uon"]
omit = ["src/uon/ux/*.py"]

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    "if TYPE_CHECKING:",
    'if __name__ == "__main__"',
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "I", "N", "UP", "B", "SIM", "S", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.importlinter]
root_package = "uon"

[[tool.importlinter.contracts]]
name = "Modular Monolith Layering"
type = "layers"
layers = [
    "uon.cli",
    "uon.auth | uon.transport",
    "uon.utils",
]

[[tool.importlinter.contracts]]
name = "Domain Independence"
type = "independence"
modules = [
    "uon.auth",
    "uon.transport",
]
