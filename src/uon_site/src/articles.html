  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const startBtn = document.querySelector(".btn-primary");
      const cliFallback = document.getElementById("cli-content");

      if (startBtn) {
        startBtn.addEventListener("click", async (e) => {
          e.preventDefault();

          startBtn.textContent = "Booting uon.core...";
          startBtn.style.pointerEvents = "none";

          try {
            const { init_terminal } = await import('/pkg/uon_core.js');
            const hero = document.querySelector(".hero");
            if (hero) hero.style.display = "none";
            if (cliFallback) cliFallback.style.display = "block";
            await init_terminal("cli-content");
          } catch (err) {
            console.error("Wasm boot failed:", err);
            startBtn.textContent = "Boot Failed. Check Console.";
          }
        });
      }

      const themeBtn = document.getElementById("theme-toggle");
      const iconSun = document.getElementById("icon-sun");
      const iconMoon = document.getElementById("icon-moon");

      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('uon-theme', theme);
        if (theme === 'dark') {
          iconSun.style.display = 'block';
          iconMoon.style.display = 'none';
        } else {
          iconSun.style.display = 'none';
          iconMoon.style.display = 'block';
        }
      }

      const activeTheme = document.documentElement.getAttribute('data-theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      applyTheme(activeTheme);

      themeBtn.addEventListener("click", () => {
        const newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        applyTheme(newTheme);
      });
    });
  </script>
