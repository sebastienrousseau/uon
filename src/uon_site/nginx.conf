server {
    listen 80;
    server_name _;
    
    # Path to the statically generated uon_site/dist directory
    root /var/www/uon/dist;
    index index.html;

    # =========================================================================
    # 1. Gzip Compression (Native Defaults)
    # =========================================================================
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6; # Optimal balance between compression latency and CPU cycles
    gzip_min_length 256;
    
    # Compress standard text, frontend assets, and SVG elements
    gzip_types 
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        text/xml
        image/svg+xml;

    # =========================================================================
    # 2. Brotli Compression (Optional Cloudflare/Nginx Edge Feature)
    # =========================================================================
    # Uncomment the block below if your Nginx environment was compiled with
    # the ngx_brotli module. Brotli significantly outperforms Gzip on JSON/CSS.
    
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types 
    #     text/plain
    #     text/css
    #     text/javascript
    #     application/javascript
    #     application/json
    #     image/svg+xml;

    # =========================================================================
    # 3. Routing & Caching Policies
    # =========================================================================
    location / {
        # Standard Single Page App (SPA) or Static Site fallback
        try_files $uri $uri/ /index.html;
        
        # Prevent caching of pure HTML files to ensure instantaneous updates
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Cache Immutable Assets (Images, Icons, Fonts)
    location ~* \.(?:ico|png|svg|webp|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}
