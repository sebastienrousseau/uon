default_language_version:
  python: python3.12

repos:
  # 1. Standard Git sanity checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  # 2. Poetry lockfile & dependency governance
  - repo: https://github.com/python-poetry/poetry
    rev: "2.1.0"
    hooks:
      - id: poetry-check
      - id: poetry-lock
        args: [--no-update]

  # 3. Lint and format (Ruff)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # 4. Strict type checking (MyPy) — runs inside Poetry venv
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: poetry run mypy
        language: system
        types: [python]
        require_serial: true
        files: ^src/
