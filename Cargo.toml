[package]
name = "uon_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "uon_core"
crate-type = ["cdylib"]
path = "rust_core/lib.rs"

[dependencies]
pyo3 = { version = "0.21.2", features = ["extension-module"] }
russh = "0.45.0"
russh-keys = "0.45.0"
zeroize = { version = "1.8.1", features = ["zeroize_derive"] }
libc = "0.2"
tokio = { version = "1.37.0", features = ["full"] }
anyhow = "1.0"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
async-trait = "0.1"
